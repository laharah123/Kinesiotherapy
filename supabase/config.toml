# Supabase local dev configuration
# Docs: https://supabase.com/docs/guides/local-development

[api]
port = 54321

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
enabled = true

[auth]
site_url = "kinesiotherapy://"
additional_redirect_urls = ["kinesiotherapy://auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = false
client_id = ""
secret = ""

[auth.external.apple]
enabled = false
client_id = "com.kinesiotherapy.app"
secret = ""
